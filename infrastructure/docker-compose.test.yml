version: "3.9"

services:
  postgres_test:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: venlaxiq_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data

  valkey_test:
    image: valkey/valkey:7-alpine
    command: valkey-server
    ports:
      - "6380:6379"
